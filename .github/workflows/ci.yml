name: CI

# typecheck -> lint -> test, plus the shared-contract hash guard, then a build.
#
# The build job exists from M1 because there is now an app to package: a renderer
# that fails to bundle, or a preload that cannot resolve @shared, breaks nothing
# the unit tests touch. It runs `electron-vite build` only -- packaging with
# electron-builder is M5's problem and needs signing material CI does not have.
#
# Still ubuntu-only. The macOS leg waits until something here is
# platform-specific; today nothing is, and a second runner would buy only latency.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Contract hash
        run: node scripts/check-contract-hash.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  build:
    # Only worth the runner minutes if the code is already known to be sound.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build main, preload and renderer
        run: npx electron-vite build

      - name: Check the bundles exist
        # A build that silently emits nothing would otherwise pass.
        run: |
          test -f out/main/index.js
          test -f out/renderer/index.html

      - name: Check the preload is CommonJS
        # Not just "a preload exists": a *sandboxed* preload cannot be ESM, and
        # package.json is "type": "module", so the format has to be forced
        # (electron.vite.config.ts). Get it wrong and Electron rejects the file
        # with "Cannot use import statement outside a module", `window.api` never
        # gets defined, and the app renders a blank window whose only symptom is
        # a line in the renderer console. Assert the invariant, not the filename.
        run: |
          test -f out/preload/index.cjs
          grep -q 'require(' out/preload/index.cjs
          ! grep -qE '^\s*import[ (]' out/preload/index.cjs

  e2e:
    # After build, because the specs drive the *built* app: the dev CSP carve-out
    # exists only in dev, so testing against the dev server would never exercise
    # the strict policy that ships.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the app
        run: npx electron-vite build

      # `safeStorage` needs a real secret service, and a bare runner has none.
      # Without it the app cannot persist an API key, so every spec that
      # restarts and expects to still be configured fails — correctly, but it
      # means the normal path would never be exercised in CI.
      - name: Install a secret service
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring libsecret-1-0 dbus-x11

      # xvfb for the display Electron needs even offscreen; dbus-run-session so
      # the keyring daemon has a bus to sit on; the empty password unlocks a
      # throwaway keyring created just for this run.
      - name: Run e2e
        env:
          # Electron picks a password store by sniffing the desktop; on a bare
          # runner there is nothing to sniff, so name it explicitly. Without this
          # it can fall back to `basic_text`, which "encrypts" with a well-known
          # key — worse than failing, because it looks like it worked.
          ELECTRON_EXTRA_LAUNCH_ARGS: --password-store=gnome-libsecret
        run: |
          xvfb-run --auto-servernum dbus-run-session -- bash -c '
            gnome-keyring-daemon --start --daemonize --components=secrets <<< "ci-throwaway"
            # The daemon exports its address into the environment of the shell it
            # was started from; give it a moment to claim org.freedesktop.secrets.
            sleep 2
            npx playwright test
          '

      - name: Upload traces and screenshots
        # A red CI run you cannot see is worse than none.
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
