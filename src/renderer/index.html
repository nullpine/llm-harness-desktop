<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No CSP meta tag on purpose. The policy is applied from the main process
      (src/main/window.ts) so it can differ between dev and a packaged build,
      and so it covers every response in the session rather than only this
      document. A meta tag here would be the stricter of the two and would break
      Vite's HMR preamble in dev.
    -->
    <title>LLM Harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
